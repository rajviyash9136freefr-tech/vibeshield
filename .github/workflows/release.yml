name: release

# Cross-compiles the pure-Go scanner (no CGO) and publishes GitHub Release
# assets in the exact naming action/entrypoint.sh downloads:
#   vibeshield-{os}-{arch}.tar.gz   (linux/darwin; arch: x86_64 | aarch64)
#   vibeshield-{os}-{arch}.zip      (windows)
# The npm wrapper (npm/vibeshield) resolves the same assets at install time.
#
# Six targets, matching ci.yml's cross-compile matrix and the six checksum
# parts the release job merges. Windows on arm64 was missing here while
# npm/vibeshield/lib/run.js already advertised it, so `npx vibeshield` on a
# Windows ARM machine asked for an asset that was never published.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, suffix: x86_64,  ext: tar.gz }
          - { goos: linux,   goarch: arm64, suffix: aarch64, ext: tar.gz }
          - { goos: darwin,  goarch: amd64, suffix: x86_64,  ext: tar.gz }
          - { goos: darwin,  goarch: arm64, suffix: aarch64, ext: tar.gz }
          - { goos: windows, goarch: amd64, suffix: x86_64,  ext: zip }
          - { goos: windows, goarch: arm64, suffix: aarch64, ext: zip }
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
      - name: Embedded rules must match rules/core/
        run: node scripts/sync-rules.mjs --check
      - name: Test
        run: cd scanner && go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p out
          cd scanner
          # Strip the leading "v" so a released binary reports the same
          # version string as a local build: "vibeshield 2.0.0", not "v2.0.0".
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" \
            -o ../out/vibeshield ./cmd/vibeshield
      - name: Package
        run: |
          NAME=vibeshield-${{ matrix.goos }}-${{ matrix.suffix }}
          cd out
          if [ "${{ matrix.ext }}" = zip ]; then
            mv vibeshield vibeshield.exe
            zip -q "$NAME.zip" vibeshield.exe
          else
            tar -czf "$NAME.tar.gz" vibeshield
          fi
          sha256sum "$NAME.${{ matrix.ext }}" > ../sha256sums-${{ matrix.goos }}-${{ matrix.suffix }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.suffix }}
          path: out/vibeshield-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.goos }}-${{ matrix.suffix }}
          # Must match the filename the Package step writes. A mismatched path
          # used to be skipped silently (upload-artifact only warns), which left
          # the release job with an empty sums/ directory and no sha256sums.txt
          # in the published release — so the npm wrapper had nothing to verify
          # against. if-no-files-found: error makes that failure loud.
          path: sha256sums-${{ matrix.goos }}-${{ matrix.suffix }}.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sums-*
          path: sums
          merge-multiple: true
      - name: Merge checksums (npm wrapper verifies against this file)
        run: |
          shopt -s nullglob
          parts=(sums/sha256sums-*.txt)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "::error::no checksum parts were uploaded — check the sums-* upload path in the build job"
            exit 1
          fi
          if [ ${#parts[@]} -ne 6 ]; then
            echo "::warning::expected 6 checksum parts, found ${#parts[@]}"
          fi
          cat "${parts[@]}" > assets/sha256sums.txt
          echo "merged ${#parts[@]} part(s):"
          cat assets/sha256sums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
