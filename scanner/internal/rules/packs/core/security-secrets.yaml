# VibeShield core pack — hardcoded secrets & credential echo (VS-SEC-001..013, 015..019)
# Known-format secret scanning tuned to training-data echo (PRD §5.5C): keys pasted
# straight out of model output. Redaction is the scanner's job, never the rule's.
schema: vibeshield.rules/v1
id: core
version: 1.0.0
license: MIT
rules:
  - id: VS-SEC-001
    category: hardcoded-secret
    severity: critical
    title: "AWS access key ID embedded in source"
    message: >-
      AKIA/ASIA-style access key IDs show up in AI output when a model echoes
      an example it memorized — and the example is often a key that was real.
      The 20-character format alone is enough for an attacker to try the pair.
    fix: "Remove the key, rotate it in IAM, and load credentials from the environment or an instance profile"
    languages: [generic]
    pattern:
      kind: regex
      match: '(AKIA|ASIA)[0-9A-Z]{16}'
    paths:
      include: ["**/*"]
      exclude: ["**/*.min.js", "**/package-lock.json", "**/yarn.lock"]
    confidence: 0.95
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#keep-credentials-secret"

  - id: VS-SEC-002
    category: hardcoded-secret
    severity: critical
    title: "GitHub token pasted into source"
    message: >-
      ghp_ / github_pat_ tokens are a common training-data echo: setup docs and
      chat answers show them inline, and scaffolding pastes the sample verbatim.
      A leaked token grants repo access regardless of who wrote the line.
    fix: "Revoke the token at github.com/settings/tokens and use a GitHub App installation or the Actions OIDC token instead"
    languages: [generic]
    pattern:
      kind: regex
      match: '(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}'
    paths:
      include: ["**/*"]
    confidence: 0.95
    references:
      - "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github"

  - id: VS-SEC-003
    category: hardcoded-secret
    severity: high
    title: "Slack bot or user token in source"
    message: >-
      xox[baprs]- tokens appear frequently in generated Slack integration
      snippets because tutorials show them inline. Even a bot token can read
      private channel history.
    fix: "Rotate the token in the Slack app dashboard and read it from an environment variable"
    languages: [generic]
    pattern:
      kind: regex
      match: 'xox[baprs]-[0-9A-Za-z-]{10,}'
    paths:
      include: ["**/*"]
    confidence: 0.9

  - id: VS-SEC-004
    category: hardcoded-secret
    severity: high
    title: "Google API key in source"
    message: >-
      AIzA-style keys are the default in copy-pasted Google Maps and Firebase
      examples, and models reproduce those examples without the API-restriction
      step the tutorial assumes. Unrestricted keys get billed to your project.
    fix: "Restrict the key by API and referrer in the Google Cloud console and inject it via the environment"
    languages: [generic]
    pattern:
      kind: regex
      match: 'AIza[0-9A-Za-z_-]{35}'
    paths:
      include: ["**/*"]
    confidence: 0.9
    references:
      - "https://cloud.google.com/docs/authentication/api-keys"

  - id: VS-SEC-005
    category: hardcoded-secret
    severity: critical
    title: "Private key material committed in PEM form"
    message: >-
      PEM private-key blocks land in repos when generated code embeds SSH or
      TLS keys as string constants instead of loading them from a secret
      store. Anything that once reached a public repo must be considered
      compromised.
    fix: "Delete the key from source, regenerate the pair, and load keys from a protected file or secret manager"
    languages: [generic]
    pattern:
      kind: regex
      match: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----'
    paths:
      include: ["**/*"]
    confidence: 0.98
    references:
      - "https://github.com/gitleaks/gitleaks"

  - id: VS-SEC-006
    category: hardcoded-secret
    severity: medium
    title: "Slack incoming-webhook URL in source"
    message: >-
      Webhook URLs are bearer secrets: the path is the only authentication.
      Generated notification code tends to paste the URL from a chat answer
      instead of reading config.
    fix: "Regenerate the webhook and store its URL in an environment variable"
    languages: [generic]
    pattern:
      kind: regex
      match: 'https://hooks\.slack\.com/services/T[0-9A-Z]+/B[0-9A-Z]+/[0-9A-Za-z]+'
    paths:
      include: ["**/*"]
    confidence: 0.85

  - id: VS-SEC-007
    category: hardcoded-secret
    severity: high
    title: "Stripe secret key in source"
    message: >-
      sk_live_ keys pasted from example code grant full payment-account
      control; sk_test_ keys reveal real integration structure and are often
      a sign a live key was swapped in later by an edit.
    fix: "Roll the key in the Stripe dashboard and read the secret from the environment at runtime"
    languages: [generic]
    pattern:
      kind: regex
      match: '(sk|rk)_(live|test)_[0-9A-Za-z]{16,}'
    paths:
      include: ["**/*"]
    confidence: 0.9
    references:
      - "https://docs.stripe.com/keys"

  - id: VS-SEC-008
    category: hardcoded-secret
    severity: high
    title: "SendGrid API key in source"
    message: >-
      SG.-format keys recur in generated transactional-email boilerplate
      because every provider quickstart shows one. A leaked mail key enables
      spoofed sends from your domain.
    fix: "Delete the key in SendGrid settings and pass it via an environment variable"
    languages: [generic]
    pattern:
      kind: regex
      match: 'SG\.[0-9A-Za-z_-]{20,}\.[0-9A-Za-z_-]{20,}'
    paths:
      include: ["**/*"]
    confidence: 0.9

  - id: VS-SEC-009
    category: hardcoded-secret
    severity: high
    title: "Twilio API key in source"
    message: >-
      AC-prefixed 32-hex key sid formats show up in SMS/auth snippets that
      models reproduce from tutorials. Twilio keys bill real money when abused.
    fix: "Rotate the credential pair in the Twilio console and load it from the environment"
    languages: [generic]
    pattern:
      kind: regex
      match: 'AC[0-9a-f]{32}'
    paths:
      include: ["**/*"]
      exclude: ["**/*.lock", "**/package-lock.json"]
    confidence: 0.75

  - id: VS-SEC-010
    category: hardcoded-secret
    severity: high
    title: "npm access token in source"
    message: >-
      npm_ tokens appear in generated CI and publish scripts copied from
      documentation. They can publish malicious versions of your packages to
      the registry.
    fix: "Revoke the token on npmjs.com and inject it through the CI secret store"
    languages: [generic]
    pattern:
      kind: regex
      match: 'npm_[0-9A-Za-z]{30,}'
    paths:
      include: ["**/*"]
    confidence: 0.9

  - id: VS-SEC-011
    category: hardcoded-secret
    severity: high
    title: "Hugging Face access token in source"
    message: >-
      hf_ tokens are pasted into model-download scripts that AI assistants
      scaffold from memory of the Hub docs. Write tokens expose private repos
      and quota.
    fix: "Revoke the token on huggingface.co/settings/tokens and read it from the HUGGING_FACE_HUB_TOKEN environment variable"
    languages: [generic]
    pattern:
      kind: regex
      match: 'hf_[A-Za-z0-9]{30,}'
    paths:
      include: ["**/*"]
    confidence: 0.9

  - id: VS-SEC-012
    category: hardcoded-secret
    severity: high
    title: "GitLab personal access token in source"
    message: >-
      glpat- tokens surface in generated CI helpers and API examples. A
      project or repo-scoped token still lets an attacker rewrite pipelines.
    fix: "Revoke the token in GitLab user settings and use CI job tokens or a masked variable"
    languages: [generic]
    pattern:
      kind: regex
      match: 'glpat-[0-9A-Za-z_-]{20,}'
    paths:
      include: ["**/*"]
    confidence: 0.9

  - id: VS-SEC-013
    category: hardcoded-secret
    severity: high
    title: "Anthropic API key in source"
    message: >-
      sk-ant- keys echo into generated integration code the same way provider
      examples show them. Usage runs on the key owner's bill within minutes.
    fix: "Rotate the key in the Anthropic console and load it from the ANTHROPIC_API_KEY environment variable"
    languages: [generic]
    pattern:
      kind: regex
      match: 'sk-ant-[0-9A-Za-z_-]{20,}'
    paths:
      include: ["**/*"]
    confidence: 0.9

  - id: VS-SEC-015
    category: hardcoded-secret
    severity: high
    title: "Telegram bot token in source"
    message: >-
      Bot tokens in digits:AA…-format are pasted from BotFather chat output
      directly into generated webhook handlers. Whoever holds the token
      impersonates the bot completely.
    fix: "Revoke the token with /revoke in BotFather and read it from an environment variable"
    languages: [generic]
    pattern:
      kind: regex
      match: '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}'
    paths:
      include: ["**/*"]
    confidence: 0.85

  - id: VS-SEC-016
    category: hardcoded-secret
    severity: medium
    title: "High-entropy value assigned to a credential-named variable"
    message: >-
      Long opaque strings bound to variables named secret, token, or api_key
      are the fingerprint of a placeholder that never got replaced — or of a
      real key pasted from a chat answer. Both belong in config, not source.
    fix: "Move the value to an environment variable or secret manager and reference it by name"
    languages: [generic]
    pattern:
      kind: regex
      match: '(secret|token|passwd|password|api[_-]?key|access[_-]?key|private[_-]?key)\s*[:=]{1,2}\s*["\x27][A-Za-z0-9_+/=.~-]{24,}["\x27]'
      flags: [caseless]
    paths:
      include: ["**/*"]
      exclude: ["**/node_modules/**", "**/*.min.js", "**/package-lock.json", "**/*.test.*", "**/*.spec.*"]
    confidence: 0.55
    references:
      - "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password"

  - id: VS-SEC-017
    category: hardcoded-secret
    severity: high
    title: "OpenAI API key hardcoded, likely pasted from chat"
    message: >-
      OPENAI_API_KEY assignments with an inline sk- value are the signature
      of a key copied out of an AI chat response or tutorial. The key is
      live to anyone who can read the repo, and git history keeps it even
      after deletion.
    fix: "Rotate the key at platform.openai.com/api-keys and read it from process.env at runtime"
    languages: [javascript, typescript, python]
    pattern:
      kind: regex
      match: 'OPENAI_API_KEY["\x27]?\s*[:=]{1,2}\s*["\x27]sk-[A-Za-z0-9_-]{20,}["\x27]?'
      flags: [caseless]
    paths:
      include: ["**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.py"]
      exclude: ["tests/**", "**/*.test.*", "**/*.spec.*", "**/test_*"]
    confidence: 0.9

  - id: VS-SEC-018
    category: hardcoded-secret
    severity: high
    title: "Database connection string with embedded password"
    message: >-
      user:password@host URLs are the default shape in generated database
      setup code, so the production password often rides along at deploy
      time. The string is a credential in every clone and backup.
    fix: "Build the connection URI at runtime from separate environment variables"
    languages: [generic]
    pattern:
      kind: regex
      match: '(postgres|postgresql|mysql|mongodb(\+srv)?|redis|amqp|mssql|sqlserver)://[A-Za-z0-9_%.-]+:[A-Za-z0-9_%.-]+@'
      flags: [caseless]
    paths:
      include: ["**/*"]
      exclude: ["**/node_modules/**", "fixtures/**"]
    confidence: 0.75

  - id: VS-SEC-019
    category: hardcoded-secret
    severity: high
    title: "Bearer or Basic authorization header with literal credential"
    message: >-
      Generated HTTP clients frequently inline an Authorization: Bearer or
      Basic value copied from a debug console or chat transcript. Basic
      headers are trivially reversible, so the password is exposed as-is.
    fix: "Set authorization headers from token values fetched from your secret store or auth flow"
    languages: [generic]
    pattern:
      kind: regex
      match: '["\x27]?(Authorization|Proxy-Authorization)["\x27]?\s*[:=]\s*["\x27]?(Bearer|Basic)\s+[A-Za-z0-9+/=_.~-]{16,}'
      flags: [caseless]
    paths:
      include: ["**/*"]
      exclude: ["**/*.md", "**/node_modules/**"]
    confidence: 0.6
